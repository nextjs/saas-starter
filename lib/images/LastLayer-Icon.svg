<?xml version="1.0" encoding="UTF-8"?>
<svg width="280" height="355" viewBox="0 0 280 355" xmlns="http://www.w3.org/2000/svg">

  <!-- 
    Simplified Loso Layer logo
    Icon uses pure geometric straight lines (corner to corner)
    Minimal points for clean scalable shapes
    Text uses system bold font matching the visual style and colors of original
  -->
  
  <g id="icon">
  
    <!-- BOTTOM ORANGE LAYER (lowest) -->
    <path fill="#8B0000" d="M 140 355 L 0 285 L 0 250 L 140 320 Z"/> <!-- front -->
    <path fill="#B71C1C" d="M 140 355 L 140 320 L 280 250 L 280 285 Z"/> <!-- side -->
    <path fill="#E30613" d="M 0 250 L 35 232.5 L 140 285 L 245 232.5 L 280 250 L 140 320 Z"/> <!-- top -->
    
    <!-- MIDDLE TEAL LAYER -->
    <path fill="#0A0A0A" d="M 140 265 L 0 195 L 0 160 L 140 230 Z"/> <!-- front -->
    <path fill="#111111" d="M 140 265 L 140 230 L 280 160 L 280 195 Z"/> <!-- side -->
    <path fill="#1A1A1A" d="M 0 160 L 35 142.5 L 140 195 L 245 142.5 L 280 160 L 140 230 Z"/> <!-- top -->
    
    <!-- TOP TEAL LAYER -->
    <path fill="#0A0A0A" d="M 140 175 L 0 105 L 0 70 L 140 140 Z"/> <!-- front -->
    <path fill="#111111" d="M 140 175 L 140 140 L 280 70 L 280 105 Z"/> <!-- side -->
    <path fill="#1A1A1A" fill-rule="evenodd" d="
      M 0 70 L 140 0 L 280 70 L 140 140 Z
      M 70 70 L 140 35 L 210 70 L 140 105 Z
    "/> <!-- top + hole -->
  </g>
</svg>
